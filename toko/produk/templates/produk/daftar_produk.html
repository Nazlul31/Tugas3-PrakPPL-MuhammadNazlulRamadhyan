{% extends 'produk/base.html' %}

{% block content %}

<h1 class="text-5xl font-extrabold text-center mb-12">
    Produk Kami
</h1>

<div class="grid grid-cols-1 md:grid-cols-3 gap-8">

    {% for p in produk %}

    <div class="bg-white rounded-2xl overflow-hidden shadow-md hover:shadow-2xl transition duration-300">

        <div class="bg-gradient-to-r from-cyan-600 to-teal-500 h-40 flex items-center justify-center">

            <i class="fas fa-laptop text-6xl text-white"></i>

        </div>

        <div class="p-6 text-center">

            <h2 class="text-2xl font-bold mb-3">
                {{ p.nama }}
            </h2>

            <p class="text-cyan-600 text-xl font-semibold mb-5">
                {{ p.harga }}
            </p>

            <a href="/produk/{{ p.id }}/"
               class="bg-cyan-600 hover:bg-cyan-700 text-white px-5 py-3 rounded-lg inline-block transition">

                Detail Produk

            </a>

        </div>

    </div>

    {% endfor %}

</div>

{% endblock %}
