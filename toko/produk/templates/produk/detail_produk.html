{% extends 'produk/base.html' %}

{% block content %}

<div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-lg overflow-hidden">

    <div class="bg-gradient-to-r from-cyan-600 to-teal-500 h-56 flex items-center justify-center">

        <i class="fas fa-laptop text-8xl text-white"></i>

    </div>

    <div class="p-10">

        {% if produk %}

        <h1 class="text-5xl font-extrabold mb-4">
            {{ produk.nama }}
        </h1>

        <p class="text-3xl text-cyan-600 font-bold mb-6">
            {{ produk.harga }}
        </p>

        <p class="text-gray-600 text-lg leading-relaxed mb-8">
            {{ produk.deskripsi }}
        </p>

        {% else %}

        <h1 class="text-3xl font-bold">
            Produk tidak ditemukan
        </h1>

        {% endif %}

        <a href="/produk/"
           class="bg-gray-800 hover:bg-black text-white px-6 py-3 rounded-lg transition">

            <i class="fas fa-arrow-left mr-2"></i>
            Kembali

        </a>

    </div>

</div>

{% endblock %}
